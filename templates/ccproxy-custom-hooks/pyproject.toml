[project]
name = "ccproxy-custom-hooks"
dynamic = ["version"]
description = "Custom hooks for ccproxy"
requires-python = ">=3.10"
dependencies = [
    "litellm",
]

[tool.setuptools.dynamic]
version = {attr = "custom_hooks.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
