ccproxy:
  debug: true
  #handler: "ccproxy.handler:CCProxyHandler"

  # OAuth token sources - shell commands to retrieve tokens for each provider
  oat_sources:
    # Option 1: Using jq (cleanest, requires: brew install jq)
    # anthropic: "security find-generic-password -s \"Claude Code-credentials\" -w | jq -r '.claudeAiOauth.accessToken'"

    # Option 2: Using sed (built-in, no dependencies)
    anthropic: "security find-generic-password -s \"Claude Code-credentials\" -w | sed -n 's/.*\"accessToken\":\"\\([^\"]*\\)\".*/\\1/p'"

  hooks:
    - ccproxy.hooks.rule_evaluator # evaluates rules against request
    - ccproxy.hooks.model_router # routes to appropriate model (coupled with rule_evaluator)
    # CUSTOM HOOK: max_tokens_adjuster
    # Install first: uv tool install --with /Users/craig/.litellm/ccproxy-custom-hooks --force claude-ccproxy --with 'litellm[proxy]'
    # See ccproxy-custom-hooks/README.md for details
    - hook: custom_hooks.max_tokens_adjuster
      params:
        safety_margin: 100  # Buffer to avoid edge cases
        model_limits:  # Override/supplement LiteLLM's built-in limits
          "gpt-4o": 4096
          "openai/gpt-4o": 4096
          "gpt-4o-mini": 16384
          "openai/gpt-4o-mini": 16384
          "gemini-2.0-flash-exp": 8192
          "gemini/gemini-2.0-flash-exp": 8192
    - ccproxy.hooks.capture_headers # captures all HTTP headers with sensitive value redaction
    - ccproxy.hooks.forward_oauth # forwards oauth token to provider (place after routing logic)

  # uses the original model that Claude Code requested when no routing rule matches.
  # NOTE: model deployments in config.yaml are still required
  #default_model_passthrough: true
  rules: []

litellm:
  host: 127.0.0.1
  port: 4000
  num_workers: 4
  debug: true
  detailed_debug: true